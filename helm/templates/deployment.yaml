{{- $tag := .Values.image.tag | default "" }}
{{- if or (eq $tag "") (eq $tag "latest") }}
{{- fail "image.tag must be a specific nginx version" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bentobox.fullname" . }}
  labels:
    {{- include "bentobox.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "bentobox.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "bentobox.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
          - name: site
            mountPath: /usr/share/nginx/html/index.html
            subPath: index.html
            readOnly: true
          - name: site
            mountPath: /usr/share/nginx/html/style.css
            subPath: style.css
            readOnly: true
          - name: site
            mountPath: /usr/share/nginx/html/script.js
            subPath: script.js
            readOnly: true
          - name: site
            mountPath: /usr/share/nginx/html/config.json
            subPath: config.json
            readOnly: true
          - name: site
            mountPath: /usr/share/nginx/html/iconoir.css.gz
            subPath: iconoir.css.gz
            readOnly: true
          - name: site
            mountPath: /etc/nginx/nginx.conf
            subPath: server.conf
            readOnly: true
          - name: tmp
            mountPath: /tmp
      volumes:
      - name: site
        configMap:
          name: {{ include "bentobox.fullname" . }}
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
